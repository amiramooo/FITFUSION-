<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | FitFusion</title>
    <link rel="stylesheet" href="auth.css" />
    <script src="auth.js" defer></script>
  </head>
  <body>
    <main class="auth-card">
      <a class="brand" href="index.html">FitFusion</a>
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Log in</h1>
      <p class="subtitle">Your fitness goals are waiting for you.</p>

      <form id="loginForm">
        <label for="loginEmail">Email address</label>
        <input
          id="loginEmail"
          name="email"
          type="email"
          autocomplete="email"
          required
        />

        <label for="loginPassword">Password</label>
        <input
          id="loginPassword"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />

        <button type="submit">Log in to FitFusion</button>
        <p
          id="loginMessage"
          class="message"
          role="status"
          aria-live="polite"
        ></p>
      </form>

      <p class="switch-link">
        New to FitFusion?
        <a href="register.html">Create an account</a>
      </p>
    </main>
  </body>
</html>
