<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join FitFusion</title>
    <link rel="stylesheet" href="auth.css" />
    <script src="auth.js" defer></script>
  </head>
  <body>
    <main class="auth-card">
      <a class="brand" href="index.html">FitFusion</a>
      <p class="eyebrow">YOUR FITNESS JOURNEY STARTS HERE</p>
      <h1>Create account</h1>
      <p class="subtitle">Build a healthier you, one day at a time.</p>

      <form id="registerForm">
        <label for="fullName">Full name</label>
        <input
          id="fullName"
          name="fullName"
          type="text"
          maxlength="100"
          autocomplete="name"
          required
        />

        <label for="registerEmail">Email address</label>
        <input
          id="registerEmail"
          name="email"
          type="email"
          autocomplete="email"
          required
        />

        <label for="registerPassword">Password</label>
        <input
          id="registerPassword"
          name="password"
          type="password"
          minlength="8"
          maxlength="72"
          autocomplete="new-password"
          required
        />

        <button type="submit">Create account</button>
        <p
          id="registerMessage"
          class="message"
          role="status"
          aria-live="polite"
        ></p>
      </form>

      <p class="switch-link">
        Already have an account?
        <a href="login.html">Log in</a>
      </p>
    </main>
  </body>
</html>
